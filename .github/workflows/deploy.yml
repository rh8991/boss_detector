name: Deploy

# Tests, deploys the Worker API (when Cloudflare credentials are configured) and
# publishes public/ to GitHub Pages, pointing the pages at the Worker URL.
#
# Repository secrets used (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  – deploy the Worker
#   EDITOR_TOKEN, HOOK_TOKEN                     – pushed to the Worker as its secrets
# Optional repository variable:
#   BOSS_API_URL – Worker URL; only needed when the Worker is deployed some other way.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  worker:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EDITOR_TOKEN: ${{ secrets.EDITOR_TOKEN }}
      HOOK_TOKEN: ${{ secrets.HOOK_TOKEN }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping Worker deploy."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $url"
      - name: Set Worker secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [ -n "$EDITOR_TOKEN" ]; then printf '%s' "$EDITOR_TOKEN" | npx wrangler secret put EDITOR_TOKEN; else echo "::warning::EDITOR_TOKEN secret not set; the boss page cannot sign in until it is."; fi
          if [ -n "$HOOK_TOKEN" ]; then printf '%s' "$HOOK_TOKEN" | npx wrangler secret put HOOK_TOKEN; else echo "::warning::HOOK_TOKEN secret not set; the iPhone automation cannot update until it is."; fi

  pages:
    needs: [test, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          BOSS_API_URL: ${{ vars.BOSS_API_URL || needs.worker.outputs.url }}
        run: |
          if [ -z "$BOSS_API_URL" ]; then
            echo "::error::No Worker URL. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (the workflow then deploys the Worker), or set the BOSS_API_URL repository variable."
            exit 1
          fi
          echo "API: $BOSS_API_URL"
          mkdir _site
          cp -r public/. _site/
          node -e 'require("fs").writeFileSync("_site/config.js", "export const API_BASE = " + JSON.stringify(process.env.BOSS_API_URL) + ";\n")'
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
