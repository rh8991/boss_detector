name: Deploy

# Tests, then publishes public/ to GitHub Pages (pointing it at the Worker API),
# and deploys the Worker too when a Cloudflare API token is configured.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  worker:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npx wrangler deploy
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set; skipping Worker deploy (deploy it with 'npm run deploy')."

  pages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          BOSS_API_URL: ${{ vars.BOSS_API_URL }}
        run: |
          if [ -z "$BOSS_API_URL" ]; then
            echo "::error::Set the repository variable BOSS_API_URL to the Worker URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          mkdir _site
          cp -r public/. _site/
          node -e 'require("fs").writeFileSync("_site/config.js", "export const API_BASE = " + JSON.stringify(process.env.BOSS_API_URL) + ";\n")'
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
